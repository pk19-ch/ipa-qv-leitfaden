[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
addopts = ["--cov=scripts", "--cov-report=term-missing"]

[tool.coverage.run]
omit = ["scripts/test_*", "scripts/conftest.py"]
