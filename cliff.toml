# git-cliff configuration for QV-Leitfaden changelog.
# https://git-cliff.org/docs/configuration

[changelog]
header = """# Changelog

Alle Änderungen am QV-Leitfaden werden hier dokumentiert.\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
## {{ version | trim_start_matches(pat="v") }}
_{{ timestamp | date(format="%d.%m.%Y") }}_
{% else -%}
## Unveröffentlicht
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.breaking %} (**BREAKING**){% endif %}\
{% if commit.github.pr_number %} ([#{{ commit.github.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.github.pr_number }})){% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"

commit_parsers = [
  { message = "^content", group = "Inhalt" },
  { message = "^design", group = "Design" },
  { message = "^fix", group = "Korrekturen" },
  { message = "^feat", group = "Neues" },
  { message = "^refactor", group = "Überarbeitung" },
  { message = "^ci", group = "CI/CD" },
  { message = "^chore", group = "Wartung" },
  { message = "^docs", group = "Dokumentation" },
  { message = "^build", group = "Build" },
  { message = ".*", group = "Sonstiges" },
]
