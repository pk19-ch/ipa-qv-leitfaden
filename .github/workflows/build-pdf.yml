name: Build PDFs

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "theme/**"
      - "assets/fonts/**"
      - "Makefile"
      - "scripts/get_version.sh"
      - ".github/workflows/build-pdf.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "theme/**"
      - "assets/fonts/**"
      - "Makefile"
      - "scripts/get_version.sh"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  typst:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.14.2"

      - name: Check changelog contains current version
        id: meta
        run: |
          ver=$(bash scripts/get_version.sh --full)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if ! grep -qF "[$ver]" src/changelog.typ; then
            echo "::error file=src/changelog.typ::Version $ver missing from Änderungshistorie — add a row before merging"
            exit 1
          fi

      - name: Compile PDFs
        run: make pdf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qv-leitfaden-pdf-${{ steps.meta.outputs.version }}
          path: dist/*.pdf
          retention-days: 30

      - name: Comment PDF link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pdf-artifacts -->';
            const body = `${marker}\n**PDF preview ready** — [download artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts) (scroll to bottom of the linked page)`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
