name: Build PDFs

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "theme/**"
      - "assets/fonts/**"
      - "Makefile"
      - ".github/workflows/build-pdf.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "theme/**"
      - "assets/fonts/**"
      - "Makefile"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typst:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.14.2"

      - name: Check changelog contains current version
        run: |
          ver=$(sed -n 's/.*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src/meta.typ)
          if ! grep -qF "[$ver]" src/changelog.typ; then
            echo "::error file=src/changelog.typ::Version $ver missing from Änderungshistorie — add a row before merging"
            exit 1
          fi

      - name: Compile PDFs
        run: make pdf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qv-leitfaden-pdf
          path: dist/*.pdf
          retention-days: 30
