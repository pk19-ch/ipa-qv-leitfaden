name: Text (spelling & grammar)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "theme/**"
      - "scripts/**"
      - "dict/**"
      - "Makefile"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/text-check.yml"
  # no paths filter: lint-text is a required status check and must report on every PR
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install hunspell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hunspell hunspell-de-ch

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Read ruff version from requirements.txt
        id: ruff
        run: |
          ver=$(grep '^ruff==' requirements.txt | cut -d= -f3)
          if [[ -z "$ver" ]]; then
            echo "::error::Could not extract ruff version from requirements.txt"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: "./scripts"
          version: ${{ steps.ruff.outputs.version }}

      - name: Run Python tests
        run: python3 -m pytest scripts/ -v

      - name: Check version bump
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          python3 scripts/check_version.py "$RUNNER_TEMP/base"

      - name: Check spelling & grammar
        env:
          LANGUAGETOOL_LANG: de-CH
          HUNSPELL_LANG: de_CH
          LANGUAGETOOL_PAUSE: "1.5"
        run: python3 scripts/check_text.py
