name: Text (spelling & grammar)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "theme/**"
      - "scripts/**"
      - "dict/**"
      - "Makefile"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/text-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "theme/**"
      - "scripts/**"
      - "dict/**"
      - "Makefile"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/text-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install hunspell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hunspell hunspell-de-ch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Read ruff version from requirements.txt
        id: ruff
        run: |
          ver=$(grep '^ruff==' requirements.txt | cut -d= -f3)
          if [[ -z "$ver" ]]; then
            echo "::error::Could not extract ruff version from requirements.txt"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/ruff-action@v3
        with:
          src: "./scripts"
          version: ${{ steps.ruff.outputs.version }}

      - name: Run Python tests
        run: python3 -m pytest scripts/ -v

      - name: Check spelling & grammar
        env:
          LANGUAGETOOL_LANG: de-CH
          HUNSPELL_LANG: de_CH
          LANGUAGETOOL_PAUSE: "1.5"
        run: python3 scripts/check_text.py
