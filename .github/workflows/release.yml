name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/meta.typ"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from meta.typ
        id: version
        run: |
          ver=$(bash scripts/get_version.sh --full)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "Detected version: $ver"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Build PDFs ────────────────────────────────────────────────────────

      - name: Install Typst
        if: steps.check.outputs.exists == 'false'
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.14.2"

      - name: Build PDFs
        if: steps.check.outputs.exists == 'false'
        run: make pdf

      # ── Changelog ─────────────────────────────────────────────────────────

      - name: Generate changelog
        if: steps.check.outputs.exists == 'false'
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --tag ${{ steps.version.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
          else
            git commit -m "chore: update CHANGELOG.md for ${{ steps.version.outputs.tag }}"
            git push origin main
          fi

      # ── Tag + Release ─────────────────────────────────────────────────────

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Generate release notes
        if: steps.check.outputs.exists == 'false'
        uses: orhun/git-cliff-action@v4
        id: release_notes
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QV-Leitfaden ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.content }}
          files: |
            dist/qv-leitfaden-${{ steps.version.outputs.version }}.pdf
            dist/qv-leitfaden-hex-nex-${{ steps.version.outputs.version }}.pdf
