name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/meta.typ"
  workflow_dispatch: # re-run a release that failed, e.g. from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from meta.typ
        id: version
        run: |
          ver=$(bash scripts/get_version.sh --full)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "Detected version: $ver"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Build PDFs ────────────────────────────────────────────────────────

      - name: Install Typst
        if: steps.check.outputs.exists == 'false'
        uses: typst-community/setup-typst@6a2cfaf0b28d636b00148f965e315bae81079aaa # v5.3.1
        with:
          typst-version: "0.15.1"

      - name: Build PDFs
        if: steps.check.outputs.exists == 'false'
        run: make pdf

      # ── Tag + Release ─────────────────────────────────────────────────────

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Generate release notes
        if: steps.check.outputs.exists == 'false'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: release_notes
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QV-Leitfaden ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.content }}
          fail_on_unmatched_files: true
          files: |
            dist/qv-leitfaden-${{ steps.version.outputs.version }}.pdf
            dist/qv-leitfaden-hex-nex-${{ steps.version.outputs.version }}.pdf
